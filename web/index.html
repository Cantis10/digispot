<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter Your Name</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #c4f5ff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* =========================================
         NAVIGATION BAR
      ========================================= */

      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        display: flex;
        align-items: center;
        background-color: #5dbbff;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }

      #Text_Logo {
        font-size: 28px;
        color: white;
        font-weight: 600;
        margin: 0;
        padding: 10px 24px;
      }

      /* =========================================
         GATE CARD
      ========================================= */

      .gate-wrap {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 100px 20px 40px;
      }

      .container {
        background: white;
        padding: 2rem 2.5rem;
        border-radius: 20px;
        box-shadow: 0 4px 4px 5px rgba(0, 0, 0, 0.25);
        text-align: center;
        width: 100%;
        max-width: 340px;
      }

      h2 {
        margin: 0 0 1.2rem;
        color: #333;
        font-size: 1.4rem;
        font-weight: bold;
      }

      input {
        width: 100%;
        height: 44px;
        padding: 0.9rem 1rem;
        margin: 0 0 1rem;
        box-sizing: border-box;
        font-size: 0.95rem;
        border: none;
        border-radius: 10px;
        background: #f6f6f6;
        color: #333;
        transition: all 0.3s ease;
        box-shadow: 0 4px 4px rgba(0, 0, 0, 0.25);
      }

      input::placeholder {
        color: #999;
      }

      input:focus {
        outline: none;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(85, 184, 255, 0.35);
      }

      input:disabled {
        background: #eee;
        color: #999;
        cursor: not-allowed;
        box-shadow: none;
      }

      button {
        width: 100%;
        padding: 11px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: #55b8ff;
        color: white;
        border: none;
        border-radius: 10px;
      }

      button:hover {
        background: #3da8f3;
      }

      @media (max-width: 480px) {
        #Text_Logo {
          font-size: 22px;
          padding: 8px 16px;
        }

        .gate-wrap {
          padding: 84px 16px 30px;
        }

        .container {
          padding: 1.6rem 1.4rem;
          border-radius: 16px;
        }
      }

    </style>
  </head>

  <body>
    <nav class="navbar">
      <p id="Text_Logo">DigiSpot</p>
    </nav>

    <div class="gate-wrap">
      <div class="container">
        <img
          src="logo.png"
          alt="Logo"
          style="width: 80px; margin-bottom: 1rem"
        />
        <h2>Enter Your Name</h2>

        <input
          type="text"
          id="name"
          placeholder="Your name"
          autocomplete="off"
        />
        <input type="text" id="password" placeholder="spot code" />
        <button onclick="goToFolder()">Submit</button>
      </div>
    </div>

    <script>
      // Read password from the current URL, if present
      const urlParams = new URLSearchParams(window.location.search);
      const queryPassword = urlParams.get("password");

      const passwordInput = document.getElementById("password");

      if (queryPassword !== null) {
        passwordInput.value = queryPassword;
        passwordInput.disabled = true;
      }

      function goToFolder() {
        const name = document.getElementById("name").value.trim();

        const password = queryPassword !== null
          ? queryPassword
          : passwordInput.value.trim();

        if (!name) {
          alert("Please enter your name.");
          return;
        }

        const params = new URLSearchParams({
          name,
          password,
        });

        window.location.href = "/folder?" + params.toString();
      }

      // Submit with Enter key
      document.getElementById("name").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          goToFolder();
        }
      });

    </script>
  </body>
</html>
